name: site

# Puts the website (the site/ folder) on GitHub Pages. Pages only offers the
# top folder or docs/ from a branch, so the site goes up from here instead.
# It runs only when asked: Actions tab, "site", Run workflow. Once, in the
# repository's Settings, Pages: set Source to "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
